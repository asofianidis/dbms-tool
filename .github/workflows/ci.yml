name: ci

# The release workflow also runs this before building, unless main's run already passed for
# that commit. Branches are checked by their pull request, so pushes only run on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    # Known vulnerabilities in the Rust dependency tree (RustSec advisory database)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec prettier --check src

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Only main saves, so branches and PRs don't evict main's caches from the 10 GB store.
      # The databases job reads the Linux cache through the shared key.
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri::generate_context! expects the frontend output folder to exist
      - name: Stub frontend build
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Format
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test

  databases:
    # End-to-end driver tests against every supported engine. Same image as the Linux rust
    # job, so it can reuse that job's build cache.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: Dbms_test_pw1
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: Dbms_test_pw1
        ports: ['53306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pDbms_test_pw1" --health-interval 5s --health-timeout 5s --health-retries 30
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: Dbms_test_pw1
        ports: ['53307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Dbms_test_pw1
        ports: ['51433:1433']
      babelfish:
        image: jonathanpotts/babelfishpg
        ports: ['51434:1433']
      mongo:
        image: mongo:8
        ports: ['57017:27017']
    env:
      DBMS_TEST_PG: localhost:55432:postgres:Dbms_test_pw1
      DBMS_TEST_MYSQL: localhost:53306:root:Dbms_test_pw1
      DBMS_TEST_MARIADB: localhost:53307:root:Dbms_test_pw1
      DBMS_TEST_MSSQL: localhost:51433:sa:Dbms_test_pw1
      DBMS_TEST_BABELFISH: localhost:51434:babelfish_user:12345678
      DBMS_TEST_MONGO: mongodb://localhost:57017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux dependencies
        uses: ./.github/actions/linux-deps

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: rust
          save-if: false

      - name: Stub frontend build
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Build tests
        working-directory: src-tauri
        run: cargo test --no-run

      - name: Wait for SQL Server and Babelfish
        run: |
          for i in $(seq 1 60); do
            if docker logs "${{ job.services.mssql.id }}" 2>&1 | grep -q "SQL Server is now ready"; then break; fi
            sleep 2
          done
          for i in $(seq 1 60); do
            (echo > /dev/tcp/localhost/51434) 2>/dev/null && break
            sleep 2
          done
          sleep 5

      - name: Live database tests
        working-directory: src-tauri
        run: cargo test integration_tests -- --test-threads=1 --nocapture
