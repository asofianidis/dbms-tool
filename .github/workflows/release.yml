name: release

# Builds signed installers for Windows, macOS and Linux, publishes them to a
# GitHub release with a changelog, checksums, build-provenance attestations and the
# updater manifest (latest.json) that installed apps poll.
#
# Channels
#   stable   Made by hand: push a vX.Y.Z tag, or run this workflow with channel "stable" to
#            release the next patch version. Becomes the Latest release, which stable apps poll.
#   nightly  Built every 6 hours from main when the app changed since the last release, as a
#            pre-release (vX.Y.Z-N). Nightly apps poll the manifest on the "nightly" release,
#            which stable releases update too, so nightly users also get those.
#
# Signing secrets live in the "release" environment, which only main and v* tags may use, so
# only build jobs for those refs can read them. Releases of both channels run without approval.
#
# Required secrets
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     Signs update bundles; the public key is in src-tauri/tauri.conf.json.
#
# Optional secrets (code signing; builds are unsigned without them)
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID  (notarization needs the last three)
#   Windows: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID,
#            AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_CERTIFICATE_PROFILE
#            (Azure Trusted Signing)

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [stable, nightly]
        default: stable

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and history, to number the release and look for changes since the last one
          fetch-depth: 0

      - name: Version
        id: version
        env:
          CHANNEL: ${{ github.event_name == 'schedule' && 'nightly' || inputs.channel || 'stable' }}
        run: |
          node scripts/release-version.mjs
          if grep -q '^release=false' "$GITHUB_OUTPUT"; then
            echo "No app changes since the last release; skipping the nightly build." >> "$GITHUB_STEP_SUMMARY"
          fi

  checks:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  draft:
    needs: [prepare, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.id }}
    steps:
      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          NAME: dbms-tool ${{ needs.prepare.outputs.tag }}${{ needs.prepare.outputs.channel == 'nightly' && ' (nightly)' || '' }}
          PRERELEASE: ${{ needs.prepare.outputs.channel == 'nightly' }}
        run: |
          # Re-runs reuse the existing draft
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="$NAME" \
              -F draft=true -F prerelease="$PRERELEASE" -f body="Built from $GITHUB_SHA." --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: ''
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            args: ''
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: ''
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check update signing key
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; releases must be signed for the auto-updater."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev patchelf

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: pnpm install --frozen-lockfile

      - name: Set version
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "
            const fs = require('fs')
            const p = 'src-tauri/tauri.conf.json'
            const c = JSON.parse(fs.readFileSync(p, 'utf8'))
            c.version = process.env.VERSION
            // CFBundleVersion only takes numbers, so nightlies use their stable version there
            c.bundle.macOS.bundleVersion = process.env.VERSION.split('-')[0]
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n')
          "

      # Only export signing variables that are actually set: the bundler treats an
      # empty APPLE_CERTIFICATE as a certificate to import and fails.
      - name: Configure code signing
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        run: |
          export_if_set() {
            for name in "$@"; do
              if [ -n "${!name}" ]; then
                { echo "$name<<__SIGNING_EOF__"; echo "${!name}"; echo "__SIGNING_EOF__"; } >> "$GITHUB_ENV"
              fi
            done
          }
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$APPLE_CERTIFICATE" ]; then
              export_if_set APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
              echo "Signing with Developer ID: $APPLE_SIGNING_IDENTITY" >> "$GITHUB_STEP_SUMMARY"
              if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                export_if_set APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
                echo "Notarizing with Apple" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::macOS build is signed but not notarized (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID missing)"
              fi
            else
              echo "::warning::macOS build is not code signed (APPLE_CERTIFICATE missing)"
            fi
          elif [ "$RUNNER_OS" = "Windows" ]; then
            if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_SIGNING_ACCOUNT" ]; then
              export_if_set AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID
              cargo install trusted-signing-cli --locked
              node -e "
                const fs = require('fs')
                const e = process.env
                const cmd = 'trusted-signing-cli -e ' + e.AZURE_SIGNING_ENDPOINT + ' -a ' + e.AZURE_SIGNING_ACCOUNT +
                  ' -c ' + e.AZURE_CERTIFICATE_PROFILE + ' -d dbms-tool %1'
                fs.writeFileSync('src-tauri/tauri.signing.conf.json', JSON.stringify({ bundle: { windows: { signCommand: cmd } } }, null, 2))
              "
              extra="--config src-tauri/tauri.signing.conf.json"
              echo "Signing with Azure Trusted Signing" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Windows build is not code signed (Azure Trusted Signing secrets missing)"
            fi
          fi
          echo "args=$extra" >> "$GITHUB_OUTPUT"

      - name: Build and upload
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ steps.signing.outputs.args }}
          # latest.json is generated once all platforms have uploaded
          uploadUpdaterJson: false

      # The bundler notarizes and staples the .app but only signs the .dmg around it. Notarize and
      # staple the .dmg too, so Gatekeeper accepts the disk image a browser downloaded, then replace
      # the uploaded copy before the publish job checksums the release assets.
      - name: Notarize dmg
        if: runner.os == 'macOS' && env.APPLE_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::Expected one .dmg, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          name=$(basename "$dmg")

          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 2h
          xcrun stapler staple "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq ".[] | select(.name == \"$name\") | .id")
          if [ -z "$id" ]; then
            echo "::error::$name is not attached to release $RELEASE_ID"
            exit 1
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          gh api -X POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
            -H "Content-Type: application/octet-stream" --input "$dmg" --jq .name
          echo "Notarized and stapled $name" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [prepare, draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History back to the previous release, for the changelog
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # setup-node v5 enables pnpm caching from package.json's packageManager field, but this
          # job only runs dependency-free scripts and never installs pnpm
          package-manager-cache: false

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          mkdir -p assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            case "$name" in latest.json|SHA256SUMS.txt) continue ;; esac
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "assets/$name"
          done
          ls -la assets

      - name: Checksums
        working-directory: assets
        run: sha256sum -- * > ../SHA256SUMS.txt && mv ../SHA256SUMS.txt . && cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'assets/*'

      - name: Changelog
        env:
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          node scripts/changelog.mjs "$PREVIOUS_TAG" > changelog.md
          { echo "## What's changed"; echo; cat changelog.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Updater manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: node scripts/updater-manifest.mjs assets "$VERSION" "$TAG" "$GITHUB_REPOSITORY" changelog.md

      - name: Upload manifest and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          upload_url="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets"
          for file in latest.json SHA256SUMS.txt; do
            existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$file\") | .id")
            [ -n "$existing" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing"
            curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@assets/$file" "$upload_url?name=$file" > /dev/null
          done

      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          {
            if [ "$CHANNEL" = "nightly" ]; then
              echo "> [!WARNING]"
              echo "> Nightly build of the latest changes on main. It may be unstable; apps on the"
              echo "> nightly release channel update to it automatically."
              echo
            fi
            echo "## What's changed"
            echo
            cat changelog.md
            if [ -n "$PREVIOUS_TAG" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREVIOUS_TAG...$TAG"
            fi
            echo
          } > notes.md
          cat >> notes.md <<NOTES
          ## Downloads

          | Platform | File |
          | --- | --- |
          | Windows (x64) | \`*_x64-setup.exe\` (recommended) or \`*.msi\` |
          | macOS (Apple Silicon and Intel) | \`*_universal.dmg\` |
          | Linux (x64) | \`*_amd64.AppImage\` (self-updating), \`*_amd64.deb\`, \`*.x86_64.rpm\` |
          | Linux (arm64) | \`*_aarch64.AppImage\` (self-updating), \`*_arm64.deb\`, \`*.aarch64.rpm\` |

          Installed apps on the $CHANNEL channel update themselves from this release.

          ## Install on macOS

          Open the \`.dmg\`, or install and update from the Terminal. The script checks the download
          against \`SHA256SUMS.txt\` and the app's signature before installing:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/scripts/install-mac.sh | bash
          \`\`\`

          ## Verifying

          Every file is listed in \`SHA256SUMS.txt\` and has a build-provenance attestation tying it
          to this repository and workflow run:

          \`\`\`sh
          gh attestation verify <file> --repo $GITHUB_REPOSITORY
          \`\`\`

          Update bundles are additionally signed with the key whose public half ships in the app.

          Built from $GITHUB_SHA.
          NOTES
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F body=@notes.md > /dev/null

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          make_latest=false
          prerelease=true
          if [ "$CHANNEL" = "stable" ]; then
            prerelease=false
            # Stable apps read releases/latest, so only a newer version may become Latest
            latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || echo "v0.0.0")
            latest=${latest#v}
            newest=$(printf '%s\n' "$latest" "$VERSION" | sort -V | tail -n1)
            if [ "$VERSION" != "$latest" ] && [ "$newest" = "$VERSION" ]; then make_latest=true; fi
          fi
          # Name the tag explicitly: publishing a draft without it makes GitHub create an
          # "untagged-<hash>" tag, which breaks the releases/download/<tag>/ URLs in latest.json
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -F draft=false -F prerelease="$prerelease" -f make_latest="$make_latest" > /dev/null
          echo "latest=$make_latest" >> "$GITHUB_OUTPUT"
          echo "Published v$VERSION ($CHANNEL, latest: $make_latest)" >> "$GITHUB_STEP_SUMMARY"

      # Nightly apps poll the manifest on the "nightly" release. A new Latest stable release is
      # newer than every nightly before it, so it goes there too and nightly users get it.
      - name: Update nightly channel
        if: needs.prepare.outputs.channel == 'nightly' || steps.publish.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .id 2>/dev/null || true)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name=nightly -f target_commitish="$GITHUB_SHA" \
              -f name="Nightly channel" -F prerelease=true -f make_latest=false \
              -f body="Holds the updater manifest for the nightly release channel. The builds themselves are the vX.Y.Z-N pre-releases." \
              --jq .id)
          fi
          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$existing" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing"
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary "@assets/latest.json" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=latest.json" > /dev/null
          echo "Nightly channel now offers v$VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Prune old nightlies
        if: needs.prepare.outputs.channel == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 10
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.prerelease and (.draft | not) and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-[0-9]+$"))) | [.created_at, .tag_name] | @tsv' |
            sort -r | tail -n +$((KEEP + 1)) | cut -f2 |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              echo "Removed old nightly $tag" >> "$GITHUB_STEP_SUMMARY"
            done
