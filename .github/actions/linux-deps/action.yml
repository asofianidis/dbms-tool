name: Linux dependencies
description: >-
  Installs the system libraries Tauri builds against. The downloaded .deb files are kept in the
  Actions cache, because the runners' Ubuntu mirror sometimes serves them at a few kB/s and turns
  a 30 second step into a 30 minute one.

runs:
  using: composite
  steps:
    - name: Resolve packages
      id: apt
      shell: bash
      run: |
        packages="libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf"
        sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
        # The key covers the exact versions to install, so an updated package or runner image
        # saves a fresh cache, while the restore key still supplies everything that didn't change
        prefix="apt-$ImageOS-$RUNNER_ARCH-"
        versions=$(apt-get install -s $packages | grep '^Inst' | sha256sum | cut -c1-16)
        echo "packages=$packages" >> "$GITHUB_OUTPUT"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix$versions" >> "$GITHUB_OUTPUT"

    - name: Restore downloaded packages
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.apt.outputs.key }}
        restore-keys: ${{ steps.apt.outputs.prefix }}

    - name: Install
      shell: bash
      env:
        PACKAGES: ${{ steps.apt.outputs.packages }}
      run: |
        mkdir -p ~/apt-archives/partial
        sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-archives" \
          -o Acquire::Retries=3 -o Acquire::http::Timeout=30 $PACKAGES
        # Drop superseded versions and apt's root-owned bookkeeping so the cache can be saved
        sudo apt-get autoclean -o Dir::Cache::Archives="$HOME/apt-archives"
        sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
        sudo chown -R "$(id -u):$(id -g)" ~/apt-archives

    # Only main saves, so branches and PRs don't fill the 10 GB cache with copies
    - name: Save downloaded packages
      if: steps.restore.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/apt-archives
        key: ${{ steps.apt.outputs.key }}
