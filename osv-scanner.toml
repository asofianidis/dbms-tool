# Advisories OSV-Scanner (and the OpenSSF Scorecard "Vulnerabilities" check) should not report.
# Each one comes in through Tauri's own pinned dependencies, so no update in this repository
# removes it; revisit when Tauri moves on. src-tauri/.cargo/audit.toml covers the same zip
# advisories for cargo audit.

# glib 0.18 (gtk-rs, Linux webview stack pinned by tauri/wry): unsound `VariantStrIter`, which
# dbms-tool never calls
[[IgnoredVulns]]
id = "RUSTSEC-2024-0429"
reason = "glib 0.18 is pinned by Tauri's GTK stack; VariantStrIter is not used"

# Unmaintained crates, no known vulnerability: glib-macros' proc-macro-error and zbus's zvariant
# family (Linux only, via tauri/rfd/notify-rust)
[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "Unmaintained notice for proc-macro-error, a build-time macro dependency of gtk-rs 0.18"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
reason = "Unmaintained notice for zvariant, pulled in by zbus through Tauri's Linux dependencies"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
reason = "Unmaintained notice for zbus_names, pulled in by zbus through Tauri's Linux dependencies"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
reason = "Unmaintained notice for zvariant_derive, pulled in by zbus through Tauri's Linux dependencies"

# zip 4.x: unsafe symlink / permission handling when *extracting* archives. dbms-tool only writes
# zips, and tauri-plugin-updater 2.x pins zip 4 and extracts only update bundles whose minisign
# signature it has already verified. Drop these once the updater moves to zip >= 9.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0367"
reason = "zip 4 is pinned by tauri-plugin-updater, which only extracts signature-verified bundles"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0368"
reason = "zip 4 is pinned by tauri-plugin-updater, which only extracts signature-verified bundles"

[[IgnoredVulns]]
id = "RUSTSEC-2026-0369"
reason = "zip 4 is pinned by tauri-plugin-updater, which only extracts signature-verified bundles"
