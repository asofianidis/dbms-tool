# cargo audit configuration (runs in CI, see .github/workflows/ci.yml)

[advisories]
ignore = [
  # zip 4.x: unsafe symlink / permission handling when *extracting* archives. dbms-tool only
  # writes zips (export.rs), and tauri-plugin-updater 2.x pins zip 4 and extracts only update
  # bundles whose minisign signature it has already verified. Drop these once the updater
  # moves to zip >= 9.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
