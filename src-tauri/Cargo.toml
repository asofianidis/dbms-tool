[package]
name = "dbms-tool"
version = "0.1.0"
description = "A developer-focused database client for PostgreSQL, MySQL, SQL Server, Babelfish and MongoDB"
authors = ["asofianidis"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dbms_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
mysql_async = { version = "0.37.1", features = ["native-tls-tls"] }
tiberius = { version = "0.13.0", default-features = false, features = ["chrono", "rust_decimal", "tds73", "winauth", "native-tls", "sql-browser-tokio"] }
mongodb = "3.9.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
thiserror = "2.0.21"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.28.0", features = ["v4"] }
futures-util = "0.3.34"
parking_lot = "0.13.0"
bson = { version = "2", features = ["chrono-0_4"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Vendored tiberius with row counts, INFO/ERROR messages and database changes
# surfaced through QueryItem (see vendor/tiberius/PATCHES.md)
[patch.crates-io]
tiberius = { path = "vendor/tiberius" }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
